
# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

logger:
  default: info
  logs:
    custom_components.schwoerer_wgt_controller: debug
    custom_components.schwoerer_lueftung: debug

# Test helpers for the controller
input_boolean:
  vacation_mode:
    name: Urlaubsmodus
    icon: mdi:palm-tree
  heizung_sperren:
    name: Heizsperre
    icon: mdi:radiator-off

input_select:
  heizung_lufterstufe:
    name: Lüfterstufe Override
    options:
      - "Auto"
      - "0"
      - "1"
      - "2"
      - "3"
      - "4"
    initial: "Auto"
    icon: mdi:fan

# Mock climate entities to simulate schwoerer_lueftung rooms
# These are for testing only - in production, schwoerer_lueftung creates these
template:
  - sensor:
      - name: "WGT Außentemperatur T10"
        unique_id: mock_wgt_outdoor_temp
        state: "12.5"
        unit_of_measurement: "°C"
        device_class: temperature
        attributes:
          entity_type: "temperature_t10_outdoor"
      - name: "WGT Lüfterstufe"
        unique_id: mock_wgt_fan_speed
        state: "2"
        attributes:
          entity_type: "fan_speed"

  - climate:
      - name: "WGT Room 1 Climate"
        unique_id: mock_wgt_room_1_climate
        modes:
          - "heat"
          - "fan_only"
        attributes:
          entity_type: "climate_room"
      - name: "WGT Room 2 Climate"
        unique_id: mock_wgt_room_2_climate
        modes:
          - "heat"
          - "fan_only"
        attributes:
          entity_type: "climate_room"

  - switch:
      - name: "WGT Heizfreigabe"
        unique_id: mock_wgt_heat_pump_heating
        state: "off"
        attributes:
          entity_type: "heat_pump_heating_enabled"
      - name: "WGT Kühlfreigabe"
        unique_id: mock_wgt_heat_pump_cooling
        state: "off"
        attributes:
          entity_type: "heat_pump_cooling_enabled"
